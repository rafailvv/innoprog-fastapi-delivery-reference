[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "redis==8.1.0",
  "celery==5.6.3",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "jinja2==3.1.6",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "structlog==26.1.0",
  "tenacity==9.1.4",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "asgi-lifespan==2.1.0",
  "pytest-cov>=5,<7",
  "testcontainers[postgres]==4.14.2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_service"]

[tool.innoprog]
asgi-app = "delivery_service.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "unit: no network, database, or external process",
  "api: public contract exercised through the ASGI boundary",
  "integration: real PostgreSQL, Redis, or another external process",
  "security: negative trust-boundary and abuse-control scenarios",
  "acceptance: complete workflow through public interfaces",
]

[tool.ruff]
target-version = "py312"
line-length = 100

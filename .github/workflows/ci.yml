name: delivery-service-ci

on: [push, pull_request]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/example/delivery-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: alembic upgrade head --sql > migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: offline-migration-${{ github.sha }}
          path: migration.sql

  pull-request-image:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: delivery-service:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: delivery-service:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL
          exit-code: "1"
      - run: |
          test "$(docker image inspect delivery-service:pr-${{ github.event.pull_request.number }} --format '{{.Config.User}}')" = "10001:10001"

  publish-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
      - run: |
          printf '{"commit":"%s","image":"%s@%s","alembic":"0006"}\n' \
            "$GITHUB_SHA" "$IMAGE" '${{ steps.build.outputs.digest }}' \
            > release-manifest.json
          grep -Eq '"image":"[^\"]+@sha256:[0-9a-f]{64}"' release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json

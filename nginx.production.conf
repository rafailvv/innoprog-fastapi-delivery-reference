events {}

http {
  upstream delivery_api {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name api.delivery.example;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.delivery.example;

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location / {
      proxy_pass http://delivery_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # This Nginx is the public trust boundary: never append a value supplied
      # by the caller, otherwise X-Forwarded-For can be forged.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Connection "";
    }
  }
}
